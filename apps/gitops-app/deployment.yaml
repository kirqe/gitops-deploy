apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-app
  namespace: default
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      k8s-app: gitops-app
  template:
    metadata:
      labels:
        k8s-app: gitops-app
    spec:
      containers:
        - name: gitops-app
          image: ghcr.io/kirqe/gitops-app:93ee393
          imagePullPolicy: Always
          ports:
            - containerPort: 8080