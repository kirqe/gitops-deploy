apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitops-app
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # host-less = catch-all. Add `host: app.example.com` to route by domain.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gitops-app
                port:
                  number: 80
